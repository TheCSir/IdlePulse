name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish app (self-contained, single-file)
        run: dotnet publish IdlePulse.csproj -c Release -o publish

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
        shell: cmd

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp installer\IdlePulse.iss
        shell: pwsh

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IdlePulse v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            publish/IdlePulse.exe
            installer/dist/IdlePulse-Setup-*.exe
